<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>トーク</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #728cb0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: #728cb0;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #ededed;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }
        .settings-panel {
            font-size: 12px;
            font-weight: normal;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .settings-panel select {
            font-size: 11px;
            padding: 2px;
        }
        .chat-screen {
            flex: 1;
            background-color: #728cb0;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            margin-bottom: 5px;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-row.ai {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
            position: relative;
        }
        .message-row.user .bubble {
            background-color: #06C755;
            color: #fff;
            border-top-right-radius: 4px;
        }
        .message-row.ai .bubble {
            background-color: #fff;
            color: #000;
            border-top-left-radius: 4px;
        }
        .bubble img {
            max-width: 100%;
            border-radius: 8px;
            display: block;
            margin-top: 4px;
        }
        .timestamp {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 6px;
            vertical-align: bottom;
            flex-shrink: 0;
        }
        .input-container {
            background-color: #f7f7f7;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background-color: #fff;
            -webkit-appearance: none;
        }
        button {
            background-color: #06c755;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>AIアシスタント</span>
        <div class="settings-panel">
            <label>モード: 
                <select id="modeSelect">
                    <option value="short">短文モード</option>
                    <option value="normal">通常モード</option>
                </select>
            </label>
            <label>応答: 
                <select id="typeSelect">
                    <option value="text">テキスト</option>
                    <option value="image">画像生成</option>
                </select>
            </label>
        </div>
    </div>

    <div class="chat-screen" id="chatScreen">
        <div class="message-row ai">
            <div class="bubble">こんにちは！何か話しかけてね。</div>
            <div class="timestamp">12:00</div>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="メッセージを入力（画像生成時は指示文）" onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">送信</button>
    </div>
</div>

<script>
    // ここにGoogle AI StudioのAPIキーを書き込んでね
    const API_KEY = "AQ.Ab8RN6Kh5gMXI_vZLsyDkKQQgBDutTbGcb_UYVEKRUL4iCQn0A";
    const TEXT_MODEL = "gemini-2.5-flash";
    const IMAGE_MODEL = "imagen-3.0-generate-002"; // 画像生成用モデル

    async function sendMessage() {
        const inputElem = document.getElementById('userInput');
        const chatScreen = document.getElementById('chatScreen');
        const modeSelect = document.getElementById('modeSelect').value;
        const typeSelect = document.getElementById('typeSelect').value;
        const text = inputElem.value.trim();

        if (!text) return;
        if (API_KEY === "ここにAPIキーを入力") {
            alert("APIキーが設定されていません！");
            return;
        }

        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

        // ユーザーのメッセージを表示
        chatScreen.innerHTML += `
            <div class="message-row user">
                <div class="timestamp">${timeStr}</div>
                <div class="bubble">${escapeHTML(text)}</div>
            </div>
        `;
        
        inputElem.value = "";
        chatScreen.scrollTop = chatScreen.scrollHeight;

        // プレースホルダー追加
        const aiRowId = "ai_row_" + Date.now();
        chatScreen.innerHTML += `
            <div class="message-row ai" id="${aiRowId}">
                <div class="bubble" style="color: #888;"><i>${typeSelect === 'image' ? '画像を生成中...' : '入力中...'}</i></div>
                <div class="timestamp">${timeStr}</div>
            </div>
        `;
        chatScreen.scrollTop = chatScreen.scrollHeight;

        try {
            const aiRow = document.getElementById(aiRowId);

            if (typeSelect === 'image') {
                // 画像生成リクエスト (Imagen)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL}:predict?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        instances: [{ prompt: text }],
                        parameters: { sampleCount: 1, aspectRatio: "1:1" }
                    })
                });

                const data = await response.json();
                if (data.predictions && data.predictions[0].bytesBase64Encoded) {
                    const base64Img = data.predictions[0].bytesBase64Encoded;
                    aiRow.innerHTML = `
                        <div class="bubble">
                            <img src="data:image/jpeg;base64,${base64Img}" alt="生成画像">
                        </div>
                        <div class="timestamp">${timeStr}</div>
                    `;
                } else {
                    aiRow.querySelector('.bubble').textContent = "（画像生成に失敗しました）";
                }

            } else {
                // テキスト生成リクエスト
                let contents = [];
                if (modeSelect === 'short') {
                    contents.push({
                        role: "user",
                        parts: [{ text: "これからLINE風のチャットをします。返信は長文にせず、LINEのトークのように短くシンプルな文章（1〜2文程度）で返してください。" }]
                    });
                }
                contents.push({
                    role: "user",
                    parts: [{ text: text }]
                });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: contents })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    aiRow.innerHTML = `
                        <div class="bubble">${escapeHTML(aiReply)}</div>
                        <div class="timestamp">${timeStr}</div>
                    `;
                } else {
                    aiRow.querySelector('.bubble').textContent = "（エラー：返信を取得できませんでした）";
                }
            }
        } catch (error) {
            const aiRow = document.getElementById(aiRowId);
            if (aiRow) {
                aiRow.querySelector('.bubble').textContent = "（通信エラー）";
            }
        }

        chatScreen.scrollTop = chatScreen.scrollHeight;
    }

    function checkEnter(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
