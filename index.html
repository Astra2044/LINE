<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>トーク</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #728cb0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: #728cb0;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #ededed;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }
        .chat-screen {
            flex: 1;
            background-color: #728cb0;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            margin-bottom: 5px;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-row.ai {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
            position: relative;
        }
        .message-row.user .bubble {
            background-color: #06C755; /* LINEの送信メッセージ風の緑色 */
            color: #000; /* 文字色を白に変更 */
            border-top-right-radius: 4px;
        }
        .message-row.ai .bubble {
            background-color: #fff;
            color: #000;
            border-top-left-radius: 4px;
        }
        .timestamp {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 6px;
            vertical-align: bottom;
            flex-shrink: 0;
        }
        .input-container {
            background-color: #f7f7f7;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background-color: #fff;
            -webkit-appearance: none;
        }
        button {
            background-color: #06c755;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        AIアシスタント
    </div>

    <div class="chat-screen" id="chatScreen">
        <div class="message-row ai">
            <div class="bubble">こんにちは！何か話しかけてね。</div>
            <div class="timestamp">12:00</div>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="メッセージを入力" onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">送信</button>
    </div>
</div>

<script>
    // ここにGoogle AI StudioのAPIキーを書き込んでね
    const API_KEY = "AQ.Ab8RN6Kh5gMXI_vZLsyDkKQQgBDutTbGcb_UYVEKRUL4iCQn0A";
    const MODEL_NAME = "gemini-2.5-flash";

    async function sendMessage() {
        const inputElem = document.getElementById('userInput');
        const chatScreen = document.getElementById('chatScreen');
        const text = inputElem.value.trim();

        if (!text) return;
        if (API_KEY === "ここにAPIキーを入力") {
            alert("APIキーが設定されていません！");
            return;
        }

        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

        chatScreen.innerHTML += `
            <div class="message-row user">
                <div class="timestamp">${timeStr}</div>
                <div class="bubble">${escapeHTML(text)}</div>
            </div>
        `;
        
        inputElem.value = "";
        chatScreen.scrollTop = chatScreen.scrollHeight;

        const aiRowId = "ai_row_" + Date.now();
        chatScreen.innerHTML += `
            <div class="message-row ai" id="${aiRowId}">
                <div class="bubble" style="color: #888;"><i>入力中...</i></div>
                <div class="timestamp">${timeStr}</div>
            </div>
        `;
        chatScreen.scrollTop = chatScreen.scrollHeight;

        try {
            // LINEっぽい短めの返信にするためのシステム指示（プロンプト）を追加
            const systemInstruction = {
                role: "user",
                parts: [{ text: "これからLINE風のチャットをします。返信は長文にせず、LINEのトークのように短くシンプルな文章（1〜2文程度）で返してください。" }]
            };
            const userMessage = {
                role: "user",
                parts: [{ text: text }]
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [systemInstruction, userMessage]
                })
            });

            const data = await response.json();
            const aiRow = document.getElementById(aiRowId);

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                aiRow.innerHTML = `
                    <div class="bubble">${escapeHTML(aiReply)}</div>
                    <div class="timestamp">${timeStr}</div>
                `;
            } else {
                aiRow.querySelector('.bubble').textContent = "（エラー：返信を取得できませんでした）";
            }
        } catch (error) {
            const aiRow = document.getElementById(aiRowId);
            if (aiRow) {
                aiRow.querySelector('.bubble').textContent = "（通信エラー）";
            }
        }

        chatScreen.scrollTop = chatScreen.scrollHeight;
    }

    function checkEnter(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
